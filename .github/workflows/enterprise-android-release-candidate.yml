name: Enterprise Android APK release candidate
on:
  push:
    branches: [feature/hr-registration-template-20261015]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/enterprise-android-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1659
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b0d
      - name: Install and typecheck/build web application
        run: |
          npm ci
          npm run build
      - name: Copy bundled web assets to Android
        run: npx --yes @capacitor/cli@8.4.0 sync android
      - name: Check release signing inputs
        env:
          KEYSTORE_B64: ${{ secrets.ENTERPRISE_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ENTERPRISE_RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ENTERPRISE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing Enterprise keystore"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing alias"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing store password"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing key password"; exit 1; }
      - name: Configure signing temporarily
        env:
          KEYSTORE_B64: ${{ secrets.ENTERPRISE_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ENTERPRISE_RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ENTERPRISE_RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/enterprise-release.jks
          printf 'storeFile=enterprise-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/signing.properties
      - name: Assemble signed release APK
        run: |
          cd android
          bash ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload signed APK as private CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-signed-release-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
