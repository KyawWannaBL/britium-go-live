name: Enterprise Android APK release candidate
on:
  push:
    branches: [feature/hr-registration-template-20261015]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/enterprise-android-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d1659
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Android SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_DIR" || { echo "Android SDK missing from runner"; exit 1; }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$SDK_DIR/platforms/android-35/android.jar"
          test -x "$SDK_DIR/build-tools/35.0.0/apksigner"
          test -x "$SDK_DIR/build-tools/35.0.0/aapt"
      - name: Install and typecheck/build web application
        run: |
          npm ci
          npm run build
      - name: Copy bundled web assets to Android
        run: npx --yes @capacitor/cli@8.4.0 sync android
      - name: Check release signing inputs
        env:
          KEYSTORE_B64: ${{ secrets.ENTERPRISE_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ENTERPRISE_RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ENTERPRISE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing Enterprise keystore"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing alias"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing store password"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing key password"; exit 1; }
      - name: Configure signing temporarily
        env:
          KEYSTORE_B64: ${{ secrets.ENTERPRISE_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ENTERPRISE_RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ENTERPRISE_RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/enterprise-release.jks
          printf 'storeFile=enterprise-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/signing.properties
      - name: Verify permanent production signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ENTERPRISE_RELEASE_CERT_SHA256 }}
          STORE_PASS: ${{ secrets.ENTERPRISE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERT_SHA256" || { echo "Missing permanent Enterprise certificate SHA256 secret"; exit 1; }
          ACTUAL="$(keytool -list -v -keystore android/app/enterprise-release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL" || { echo "Cannot inspect Enterprise signing keystore or alias"; exit 1; }
          test "$ACTUAL" = "$EXPECTED" || { echo "Production signer differs from the enrolled permanent Enterprise certificate"; exit 1; }
          test "$ACTUAL" != "990fcbce5147015e4a802a4bca6fef44f201c9266eacb38d6ffb08e819d49155" || { echo "Unexpected legacy debug signer"; exit 1; }
      - name: Assemble signed release APK
        run: |
          cd android
          bash ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Verify Android fresh-install identity and permanent signer
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ENTERPRISE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_DIR/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "name='com.britiumexpress.enterpriseportal'"
          echo "$BADGING" | grep -F "versionCode='300024'"
          echo "$BADGING" | grep -F "sdkVersion='23'"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED" || { echo "Built APK does not use enrolled production signing key"; exit 1; }
          echo "NEW INSTALL REQUIRED for legacy debug-signed Enterprise APKs; in-place upgrade is not supported."
      - name: Upload signed APK as private CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-permanent-signed-fresh-install-v3.0.24
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
