name: Britium Enterprise Portal Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/britium-enterprise-android.yml"
      - "!public/downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: britium-enterprise-android-release
  cancel-in-progress: false

jobs:
  build-enterprise-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@8.4.0

      - name: Build Enterprise Portal UI
        run: |
          set -euo pipefail
          npm run build
          rm -rf dist/downloads
          test -s dist/index.html
          test -d dist/assets

      - name: Generate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Configure Enterprise Android app
        env:
          ENTERPRISE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          run_number = int(os.environ["ENTERPRISE_VERSION_CODE"])
          version_code = 200000 + run_number
          version_name = f"2.0.{run_number}"

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, c1 = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, c2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', source, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not set Android version")
          gradle.write_text(source)

          strings = Path("android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Britium Enterprise Portal</string>', s)
          s = re.sub(r'<string name="title_activity_main">.*?</string>', '<string name="title_activity_main">Britium Enterprise Portal</string>', s)
          strings.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          marker = "<application"
          additions = ""
          for permission in permissions:
              token = f'android:name="{permission}"'
              if token not in m:
                  additions += f'    <uses-permission android:name="{permission}" />\n'
          if additions:
              m = m.replace(marker, additions + marker, 1)
          manifest.write_text(m)

          print(f"Enterprise APK versionCode={version_code}, versionName={version_name}")
          PY

      - name: Build installable APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Enterprise Portal APK
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Britium-Enterprise-Portal.apk
          test -s public/downloads/Britium-Enterprise-Portal.apk
          ls -lh public/downloads/Britium-Enterprise-Portal.apk
          sha256sum public/downloads/Britium-Enterprise-Portal.apk > enterprise-apk-sha256.txt

      - name: Commit Enterprise Portal APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Britium-Enterprise-Portal.apk
          if git diff --cached --quiet; then
            echo "Enterprise APK unchanged; no commit required."
          else
            git commit -m "build: publish Enterprise Portal Android APK"
            git push origin HEAD:main
          fi

      - name: Upload Enterprise APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Enterprise-Portal-Android
          path: |
            public/downloads/Britium-Enterprise-Portal.apk
            enterprise-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
