name: Britium Enterprise Portal Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - "britium-go-live/src/**"
      - "britium-go-live/scripts/**"
      - "britium-go-live/android-assets/**"
      - "public/favicon.svg"
      - "britium-go-live/index.html"
      - "britium-go-live/package.json"
      - "britium-go-live/package-lock.json"
      - "britium-go-live/vite.config.ts"
      - "britium-go-live/postcss.config.mjs"
      - "britium-go-live/tailwind.config.cjs"
      - "britium-go-live/capacitor.config.ts"
      - ".github/workflows/britium-enterprise-android.yml"
      - "scripts/verify-enterprise-signing.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: britium-enterprise-android-release
  cancel-in-progress: true

jobs:
  build-enterprise-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: britium-go-live/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify permanent signing policy
        run: node scripts/verify-enterprise-signing.mjs

      - name: Require permanent Enterprise signing secrets
        env:
          ENTERPRISE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_BASE64 }}
          ENTERPRISE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_PASSWORD }}
          ENTERPRISE_ANDROID_KEY_ALIAS: ${{ secrets.ENTERPRISE_ANDROID_KEY_ALIAS }}
          ENTERPRISE_ANDROID_KEY_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEY_PASSWORD }}
          ENTERPRISE_ANDROID_CERT_SHA256: ${{ secrets.ENTERPRISE_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ENTERPRISE_ANDROID_KEYSTORE_BASE64 ENTERPRISE_ANDROID_KEYSTORE_PASSWORD ENTERPRISE_ANDROID_KEY_ALIAS ENTERPRISE_ANDROID_KEY_PASSWORD ENTERPRISE_ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent Enterprise signing secret: ${name}"
              exit 1
            fi
          done

      - name: Install dependencies
        working-directory: britium-go-live
        run: npm ci

      - name: Install Capacitor CLI
        working-directory: britium-go-live
        run: npm install --no-save @capacitor/cli@8.4.0 @capacitor/assets sharp

      - name: Build production Enterprise Portal UI
        working-directory: britium-go-live
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -d dist/assets

      - name: Generate clean Android project
        working-directory: britium-go-live
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Generate verified blue Enterprise launcher icon
        working-directory: britium-go-live
        run: |
          set -euo pipefail
          node scripts/prepare-enterprise-icon.cjs
          test -s assets/logo.png
          npx @capacitor/assets generate --android \
            --assetPath assets \
            --iconBackgroundColor '#0759D6' \
            --iconBackgroundColorDark '#0649B8' \
            --splashBackgroundColor '#07111F' \
            --splashBackgroundColorDark '#07111F'

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          (async () => {
            const root = 'android/app/src/main/res';
            for (const dir of fs.readdirSync(root).filter((name) => name.startsWith('mipmap-'))) {
              const full = path.join(root, dir);
              if (!fs.statSync(full).isDirectory()) continue;
              for (const file of fs.readdirSync(full).filter((name) => /^ic_launcher.*\.png$/.test(name))) {
                const src = path.join(full, file);
                const tmp = src + '.truecolor.png';
                await sharp(src).toColourspace('srgb').png({ palette: false, compressionLevel: 9 }).toFile(tmp);
                fs.renameSync(tmp, src);
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/res")
          for png in root.glob("mipmap-*/ic_launcher_foreground.png"):
              png.unlink(missing_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (root / "mipmap-anydpi-v26" / name).unlink(missing_ok=True)
          legacy = root / "mipmap-xxxhdpi" / "ic_launcher.png"
          if not legacy.is_file() or legacy.stat().st_size == 0:
              raise SystemExit("Enterprise launcher icon was not generated")
          print("Blue Enterprise launcher icon prepared for Android 8+.")
          PY

      - name: Configure Enterprise Android app
        working-directory: britium-go-live
        env:
          ENTERPRISE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          run_number = int(os.environ["ENTERPRISE_VERSION_CODE"])
          version_code = 300000 + run_number
          version_name = f"3.0.{run_number}"

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, c1 = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, c2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', source, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not set Android version")
          gradle.write_text(source)

          strings = Path("android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Britium Enterprise Portal</string>', s)
          s = re.sub(r'<string name="title_activity_main">.*?</string>', '<string name="title_activity_main">Britium Enterprise Portal</string>', s)
          strings.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if 'android.permission.CAMERA' not in m:
              m = m.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />'
              )
          m = m.replace(
              'android:theme="@style/AppTheme">',
              'android:theme="@style/AppTheme"\n'
              '        android:hardwareAccelerated="true"\n'
              '        android:usesCleartextTraffic="false">'
          )
          manifest.write_text(m)
          PY

      - name: Restore permanent Enterprise keystore
        working-directory: britium-go-live
        env:
          ENTERPRISE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ENTERPRISE_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/britium-enterprise-release.jks
          test -s android/app/britium-enterprise-release.jks
          chmod 600 android/app/britium-enterprise-release.jks

      - name: Diagnose restored Enterprise signing key safely
        working-directory: britium-go-live
        env:
          ENTERPRISE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_PASSWORD }}
          ENTERPRISE_ANDROID_KEY_ALIAS: ${{ secrets.ENTERPRISE_ANDROID_KEY_ALIAS }}
          ENTERPRISE_ANDROID_KEY_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEY_PASSWORD }}
          ENTERPRISE_ANDROID_CERT_SHA256: ${{ secrets.ENTERPRISE_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          store="android/app/britium-enterprise-release.jks"
          expected_hash="773d904ebd8b7ed60ccdc365ec9f2e031abc8b390c1c964cac5d984b12fe0627"
          actual_hash="$(sha256sum "$store" | awk '{print $1}')"
          if ! keytool -list -keystore "$store" -storepass:env ENTERPRISE_ANDROID_KEYSTORE_PASSWORD -alias "$ENTERPRISE_ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The configured password or alias cannot open the Enterprise keystore."
            exit 1
          fi
          # Certificate identity is stable across keystore re-serialization;
          # whole-file bytes are not. Never accept a different certificate.
          ACTUAL="$(keytool -exportcert -keystore "$store" -storepass:env ENTERPRISE_ANDROID_KEYSTORE_PASSWORD -alias "$ENTERPRISE_ANDROID_KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
          EXPECTED="$(printf '%s' "$ENTERPRISE_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Restored Enterprise keystore certificate does not match the permanent certificate."
            exit 1
          fi
          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "::notice::Keystore serialization differs from the original file; permanent certificate identity verified."
          fi
          echo "Enterprise keystore password and alias verified before Gradle."
          if [ "$ENTERPRISE_ANDROID_KEY_PASSWORD" != "$ENTERPRISE_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Private key password differs from keystore password; standard PKCS12 keys commonly use the same password. Verify ENTERPRISE_ANDROID_KEY_PASSWORD."
          fi

      - name: Configure permanent release signing
        working-directory: britium-go-live
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  britiumRelease {
                      storeFile file("britium-enterprise-release.jks")
                      storePassword System.getenv("ENTERPRISE_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ENTERPRISE_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ENTERPRISE_ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.britiumRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        working-directory: britium-go-live/android
        env:
          ENTERPRISE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_PASSWORD }}
          ENTERPRISE_ANDROID_KEY_ALIAS: ${{ secrets.ENTERPRISE_ANDROID_KEY_ALIAS }}
          ENTERPRISE_ANDROID_KEY_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Prepare and verify Enterprise Portal APK and AAB
        working-directory: britium-go-live
        env:
          ENTERPRISE_ANDROID_CERT_SHA256: ${{ secrets.ENTERPRISE_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Britium-Enterprise-Portal.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Britium-Express-Enterprise.aab
          test -s Britium-Enterprise-Portal.apk
          ls -lh Britium-Enterprise-Portal.apk

          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          python3 - <<'PY'
          import zipfile
          apk = "Britium-Enterprise-Portal.apk"
          with zipfile.ZipFile(apk, "r") as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK member: {bad}")
              names = set(z.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK missing required entries: {sorted(missing)}")
          print("APK ZIP integrity: OK")
          PY

          "$AAPT" dump badging Britium-Enterprise-Portal.apk | tee enterprise-apk-badging.txt
          grep -q "package: name='com.britiumexpress.enterpriseportal'" enterprise-apk-badging.txt
          grep -q "sdkVersion:'24'" enterprise-apk-badging.txt
          grep -q "uses-permission: name='android.permission.CAMERA'" enterprise-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs Britium-Enterprise-Portal.apk | tee enterprise-apk-signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" enterprise-apk-signing.txt

          ACTUAL="$($APKSIGNER verify --print-certs Britium-Enterprise-Portal.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$ENTERPRISE_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Enterprise signing certificate does not match the permanent certificate."
            exit 1
          fi
          jarsigner -verify Britium-Express-Enterprise.aab > enterprise-aab-signing.txt
          grep -q "jar verified" enterprise-aab-signing.txt
          AAB_CERT="$(keytool -printcert -jarfile Britium-Express-Enterprise.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$AAB_CERT" ] || [ "$AAB_CERT" != "$EXPECTED" ]; then
            echo "::error::Enterprise AAB signing certificate does not match the permanent certificate."
            exit 1
          fi
          sha256sum Britium-Express-Enterprise.aab > enterprise-aab-sha256.txt
          echo "Permanent Enterprise APK and AAB signing certificates verified."
          sha256sum Britium-Enterprise-Portal.apk > enterprise-apk-sha256.txt

      - name: Publish APK to stable GitHub Release
        working-directory: britium-go-live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view enterprise-portal-latest >/dev/null 2>&1; then
            gh release upload enterprise-portal-latest Britium-Enterprise-Portal.apk Britium-Express-Enterprise.aab enterprise-apk-sha256.txt enterprise-aab-sha256.txt --clobber
          else
            gh release create enterprise-portal-latest Britium-Enterprise-Portal.apk Britium-Express-Enterprise.aab enterprise-apk-sha256.txt enterprise-aab-sha256.txt \
              --title "Britium Enterprise Portal Android" \
              --notes "Permanent-signed Britium Enterprise Portal APK for direct installation and AAB for Google Play upload. Confirm the Play listing package and upload certificate before submitting."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Enterprise-Portal-Android
          path: |
            britium-go-live/Britium-Enterprise-Portal.apk
            britium-go-live/Britium-Express-Enterprise.aab
            britium-go-live/enterprise-aab-sha256.txt
            britium-go-live/enterprise-aab-signing.txt
            britium-go-live/enterprise-apk-sha256.txt
            britium-go-live/enterprise-apk-badging.txt
            britium-go-live/enterprise-apk-signing.txt
          if-no-files-found: error
          retention-days: 30
