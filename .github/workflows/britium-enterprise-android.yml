name: Britium Enterprise Portal Android APK

on:
  push:
    branches: [main]
    paths:
      - "britium-go-live/src/**"
      - "britium-go-live/public/**"
      - "britium-go-live/index.html"
      - "britium-go-live/package.json"
      - "britium-go-live/package-lock.json"
      - "britium-go-live/vite.config.ts"
      - "britium-go-live/capacitor.config.ts"
      - "britium-go-live/android/**"
      - ".github/workflows/britium-enterprise-android.yml"
      - "!britium-go-live/public/downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: britium-enterprise-android-release
  cancel-in-progress: false

jobs:
  build-enterprise-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: britium-go-live/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: britium-go-live
        run: npm ci

      - name: Build packaged Enterprise Portal web application
        working-directory: britium-go-live
        run: |
          set -euo pipefail
          npx vite build
          rm -rf dist/downloads
          test -s dist/index.html
          test -d dist/assets

      - name: Sync Capacitor Android project
        working-directory: britium-go-live
        run: npx -y @capacitor/cli@8.4.0 sync android

      - name: Configure Enterprise app identity and version
        working-directory: britium-go-live
        env:
          ENTERPRISE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          run_number = int(os.environ["ENTERPRISE_VERSION_CODE"])
          version_code = 200000 + run_number
          version_name = f"2.0.{run_number}"

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, count_code = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, count_name = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', source, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not set Enterprise Android versionCode/versionName")
          gradle.write_text(source)

          strings = Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              s = strings.read_text()
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Britium Enterprise Portal</string>', s)
              s = re.sub(r'<string name="title_activity_main">.*?</string>', '<string name="title_activity_main">Britium Enterprise Portal</string>', s)
              strings.write_text(s)

          print(f"Enterprise Android versionCode={version_code}, versionName={version_name}")
          PY

      - name: Require permanent Britium signing secrets
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
          RIDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          RIDER_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
          RIDER_ANDROID_KEY_PASSWORD: ${{ secrets.RIDER_ANDROID_KEY_PASSWORD }}
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in \
            RIDER_ANDROID_KEYSTORE_BASE64 \
            RIDER_ANDROID_KEYSTORE_PASSWORD \
            RIDER_ANDROID_KEY_ALIAS \
            RIDER_ANDROID_KEY_PASSWORD \
            RIDER_ANDROID_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Restore permanent Britium release keystore
        working-directory: britium-go-live
        env:
          RIDER_ANDROID_KEYSTORE_BASE64: ${{ secrets.RIDER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RIDER_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/britium-enterprise-release.jks
          test -s android/app/britium-enterprise-release.jks
          chmod 600 android/app/britium-enterprise-release.jks

      - name: Configure permanent Enterprise release signing
        working-directory: britium-go-live
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Britium Enterprise permanent release signing.
          android {
              signingConfigs {
                  britiumEnterpriseRelease {
                      storeFile file(System.getenv("ENTERPRISE_ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ENTERPRISE_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ENTERPRISE_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ENTERPRISE_ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.britiumEnterpriseRelease
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build signed Enterprise release APK and Play AAB
        working-directory: britium-go-live/android
        env:
          ENTERPRISE_ANDROID_KEYSTORE_PATH: britium-enterprise-release.jks
          ENTERPRISE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RIDER_ANDROID_KEYSTORE_PASSWORD }}
          ENTERPRISE_ANDROID_KEY_ALIAS: ${{ secrets.RIDER_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify Enterprise release certificate
        working-directory: britium-go-live
        env:
          RIDER_ANDROID_CERT_SHA256: ${{ secrets.RIDER_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee enterprise-signing-info.txt
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$RIDER_ANDROID_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Enterprise APK signing certificate does not match the pinned Britium certificate."
            exit 1
          fi
          echo "Enterprise signing certificate verified: $ACTUAL"

      - name: Prepare Enterprise release files
        working-directory: britium-go-live
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk Britium-Enterprise-Portal.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Britium-Enterprise-Portal.aab
          cp Britium-Enterprise-Portal.apk public/downloads/Britium-Enterprise-Portal.apk
          sha256sum Britium-Enterprise-Portal.apk Britium-Enterprise-Portal.aab > enterprise-release-sha256.txt
          test -s public/downloads/Britium-Enterprise-Portal.apk

      - name: Commit signed Enterprise APK to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add britium-go-live/public/downloads/Britium-Enterprise-Portal.apk
          if git diff --cached --quiet; then
            echo "Enterprise APK unchanged; no repository commit needed."
          else
            git commit -m "build: publish signed Enterprise Portal Android APK"
            git push origin HEAD:main
          fi

      - name: Upload signed Enterprise release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Enterprise-Portal-Android-Release
          path: |
            britium-go-live/Britium-Enterprise-Portal.apk
            britium-go-live/Britium-Enterprise-Portal.aab
            britium-go-live/enterprise-signing-info.txt
            britium-go-live/enterprise-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
