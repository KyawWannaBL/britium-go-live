name: Britium Enterprise Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "android/**"
      - ".github/workflows/britium-enterprise-android.yml"

permissions:
  contents: read

jobs:
  build-enterprise-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Build Enterprise web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx -y @capacitor/cli@8.4.0 sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Britium-Enterprise.apk

      - name: Upload Enterprise APK
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Enterprise-APK
          path: release/Britium-Enterprise.apk
          if-no-files-found: error
          retention-days: 30
