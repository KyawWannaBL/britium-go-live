name: Production Build Diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: britium-go-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: britium-go-live/package-lock.json
      - run: npm ci
      - run: node ../scripts/test-october-preparation.mjs
      - run: node scripts/test-reason-only-photo-skip.mjs
      - run: node scripts/test-reason-only-photo-skip-db.mjs
      - run: node scripts/test-cod-review-actions-db.mjs
      - run: node scripts/test-cod-review-actions-ui.mjs
      - run: node scripts/test-cod-review-sync-db.mjs
      - run: node scripts/test-warehouse-delivered-status.mjs
      - run: node scripts/test-payment-allocations-ui.mjs
      - run: node scripts/test-finance-collection-totals-ui.mjs
      - run: node scripts/test-finance-cod-filters.mjs
      - run: node scripts/test-field-settlement-signature-ui.mjs
      - run: node scripts/test-split-collection-db.mjs
      - run: node scripts/test-split-delivery-sync-db.mjs
      - run: node scripts/test-split-helper-handoff-db.mjs
      - run: npm run build
