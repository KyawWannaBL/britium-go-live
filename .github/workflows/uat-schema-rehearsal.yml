name: Isolated UAT migration replay (no remote)
on:
  push:
    branches:
      - uat/mdy-insein-isolated-20261116
    paths:
      - .github/workflows/uat-schema-rehearsal.yml
  workflow_dispatch:
  pull_request:
    branches:
      - uat/mdy-insein-isolated-20261116
    paths:
      - .github/workflows/uat-schema-rehearsal.yml
      - britium-go-live/scripts/uat-schema-replay-preflight.mjs

permissions:
  contents: read

concurrency:
  group: isolated-uat-schema-rehearsal
  cancel-in-progress: true

jobs:
  financial_waybill_regression:
    name: Financial waybill safety regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise unchanged V136.1 and preserved denial paths
        working-directory: britium-go-live
        run: |
          npm install --prefix "$RUNNER_TEMP/waybill-test" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.9
          ln -s "$RUNNER_TEMP/waybill-test/node_modules" node_modules
          node scripts/test-uat-financial-waybill-predecessor.mjs

  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_CONNECT_REMOTE: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: britium-go-live
        shell: bash
    steps:
      - name: Checkout isolated branch with no persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify isolated branch
        run: |
          test "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" = "uat/mdy-insein-isolated-20261116"
          test -f supabase/migrations/20260721093501_remote_schema.sql
          node scripts/uat-schema-replay-preflight.mjs
      - name: Run local Supabase stack and replay migrations
        id: replay
        run: |
          set -o pipefail
          echo "Starting disposable local Supabase; NO linked project, credentials, or remote flags."
          node scripts/uat-snapshot-remove-pgtap-duplicate.mjs
          node scripts/uat-rehearsal-finance-foundation.mjs
          node scripts/uat-rehearsal-wayplan-legacy-overlay.mjs
          node scripts/uat-rehearsal-finance-v61-8-1-overlay.mjs
          node scripts/uat-rehearsal-fleet-master-catalog-overlay.mjs
          node scripts/uat-rehearsal-field-identity-overlay.mjs
          node scripts/uat-rehearsal-v33-parcel-waybills.mjs
          node scripts/uat-rehearsal-v36-foundation.mjs
          node scripts/uat-rehearsal-v39-ledger-foundation.mjs
          node scripts/uat-rehearsal-v39-receipt-views.mjs
          node scripts/uat-rehearsal-login-identity-overlay.mjs
          node scripts/uat-rehearsal-legacy-finance-view-overlay.mjs
          node scripts/uat-rehearsal-v58-request-ledger.mjs
          node scripts/uat-rehearsal-v13-calculator.mjs
          node scripts/uat-rehearsal-archived-v28.mjs
          node scripts/uat-rehearsal-v57-access.mjs
          node scripts/uat-rehearsal-original-township-v61-4-1.mjs
          node scripts/uat-rehearsal-v40-membership.mjs
          node scripts/uat-rehearsal-tariff-alias-v61-7-1.mjs
          node scripts/uat-rehearsal-v122-bilingual-key-overlay.mjs
          node scripts/uat-rehearsal-v140-pickup-verification.mjs
          node scripts/uat-rehearsal-v141-proof-sync.mjs
          node scripts/uat-rehearsal-legacy-warehouse-revokes.mjs
          node scripts/uat-rehearsal-v39-failure-recursion-preimage.mjs
          node scripts/uat-rehearsal-v136-waybill-gate.mjs
          node scripts/uat-rehearsal-financial-waybill-v136-1.mjs
          node scripts/uat-rehearsal-v122-diagnostic.mjs
          node scripts/uat-rehearsal-wayid-v33-allocator.mjs
          node scripts/uat-rehearsal-territory-table.mjs
          node scripts/uat-rehearsal-v43-wayplan-reviews.mjs
          node scripts/uat-rehearsal-v63-data-entry-columns.mjs
          node scripts/uat-rehearsal-return-scan-v39.mjs
          node scripts/uat-rehearsal-v45-wayplan-tables.mjs
          node scripts/uat-rehearsal-v46-rider-tables.mjs
          node scripts/uat-rehearsal-data-entry-view-dependency.mjs
          node -e "const fs=require('fs');const p='supabase/config.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('[inbucket]','[local_smtp]'))"
          npm exec --yes --package=supabase@3.1.0 -- supabase start 2>&1 | tee "$RUNNER_TEMP/uat-schema-rehearsal.log"
          echo "Explicit clean LOCAL replay without seed data. No remote flags."
          npm exec --yes --package=supabase@3.1.0 -- supabase db reset --local --no-seed 2>&1 | tee -a "$RUNNER_TEMP/uat-schema-rehearsal.log"
      - name: Enforce local UAT schema and RLS readiness
        run: node scripts/uat-local-schema-gate.mjs
      - name: Report core table readiness if local replay succeeded
        if: success()
        run: |
          echo "Local Supabase migration replay completed twice: start and clean --local reset. This does not certify RLS or account readiness."
          echo "Run branch-scoped RPC and RLS tests before promoting any repair."
      - name: Publish sanitized first failure lines
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/uat-schema-rehearsal.log"; then
            grep -iE 'error:|failed|already exists|migration|syntax error' "$RUNNER_TEMP/uat-schema-rehearsal.log" | head -n 35 || true
          fi
          echo "The failure is isolated to the disposable CI database. No remote Supabase changes were attempted."

  snapshot_first:
    name: Snapshot-first schema compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_CONNECT_REMOTE: "1"
    defaults:
      run:
        working-directory: britium-go-live
        shell: bash
    steps:
      - name: Checkout isolated UAT code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare disposable snapshot-first migration ordering
        run: |
          set -euo pipefail
          test "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" = "uat/mdy-insein-isolated-20261116"
          node scripts/uat-schema-replay-preflight.mjs
          mkdir -p "$RUNNER_TEMP/uat-old-baseline"
          shopt -s nullglob
          count=0
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            version="${base:0:14}"
            if [[ "$version" < "20260721093501" ]]; then
              mv "$f" "$RUNNER_TEMP/uat-old-baseline/"
              count=$((count + 1))
            fi
          done
          echo "Excluded $count older migrations from this disposable checkout only."
          test -f supabase/migrations/20260721093501_remote_schema.sql
          test "$count" -gt 0
      - name: Attempt snapshot-first local replay only
        run: |
          set -o pipefail
          echo "This tests whether July schema snapshot can serve as a standalone baseline."
          echo "No linked Supabase project, credentials, data, or production commands."
          node scripts/uat-snapshot-remove-pgtap-duplicate.mjs
          node scripts/uat-rehearsal-finance-foundation.mjs
          node scripts/uat-rehearsal-wayplan-legacy-overlay.mjs
          node scripts/uat-rehearsal-finance-v61-8-1-overlay.mjs
          node scripts/uat-rehearsal-fleet-master-catalog-overlay.mjs
          node scripts/uat-rehearsal-field-identity-overlay.mjs
          node scripts/uat-rehearsal-v33-parcel-waybills.mjs
          node scripts/uat-rehearsal-v36-foundation.mjs
          node scripts/uat-rehearsal-v39-ledger-foundation.mjs
          node scripts/uat-rehearsal-v39-receipt-views.mjs
          node scripts/uat-rehearsal-login-identity-overlay.mjs
          node scripts/uat-rehearsal-legacy-finance-view-overlay.mjs
          node scripts/uat-rehearsal-v58-request-ledger.mjs
          node scripts/uat-rehearsal-v13-calculator.mjs
          node scripts/uat-rehearsal-archived-v28.mjs
          node scripts/uat-rehearsal-v57-access.mjs
          node scripts/uat-rehearsal-original-township-v61-4-1.mjs
          node scripts/uat-rehearsal-v40-membership.mjs
          node scripts/uat-rehearsal-tariff-alias-v61-7-1.mjs
          node scripts/uat-rehearsal-v122-bilingual-key-overlay.mjs
          node scripts/uat-rehearsal-v140-pickup-verification.mjs
          node scripts/uat-rehearsal-v141-proof-sync.mjs
          node scripts/uat-rehearsal-legacy-warehouse-revokes.mjs
          node scripts/uat-rehearsal-v39-failure-recursion-preimage.mjs
          node scripts/uat-rehearsal-v136-waybill-gate.mjs
          node scripts/uat-rehearsal-financial-waybill-v136-1.mjs
          node scripts/uat-rehearsal-v122-diagnostic.mjs
          node scripts/uat-rehearsal-wayid-v33-allocator.mjs
          node scripts/uat-rehearsal-territory-table.mjs
          node scripts/uat-rehearsal-v43-wayplan-reviews.mjs
          node scripts/uat-rehearsal-v63-data-entry-columns.mjs
          node scripts/uat-rehearsal-return-scan-v39.mjs
          node scripts/uat-rehearsal-v45-wayplan-tables.mjs
          node scripts/uat-rehearsal-v46-rider-tables.mjs
          node scripts/uat-rehearsal-data-entry-view-dependency.mjs
          node -e "const fs=require('fs');const p='supabase/config.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('[inbucket]','[local_smtp]'))"
          npm exec --yes --package=supabase@3.1.0 -- supabase start 2>&1 | tee "$RUNNER_TEMP/snapshot-first.log"
          npm exec --yes --package=supabase@3.1.0 -- supabase db reset --local --no-seed 2>&1 | tee -a "$RUNNER_TEMP/snapshot-first.log"
      - name: Enforce snapshot-first UAT schema and RLS readiness
        run: node scripts/uat-local-schema-gate.mjs
      - name: Display first failure evidence
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/snapshot-first.log"; then
            grep -iE 'error:|failed|already exists|migration|syntax error|does not exist' "$RUNNER_TEMP/snapshot-first.log" | head -n 40 || true
          fi
          echo "Snapshot-first failure is diagnostic only. No remote changes."
