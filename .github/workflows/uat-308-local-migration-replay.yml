name: UAT 308 Local Migration Replay (No Remote DB)
on:
  push:
    branches:
      - fix/uat-migration-replay-audit-308
    paths:
      - '.github/workflows/uat-308-local-migration-replay.yml'
      - 'scripts/uat-audit/**'
      - 'supabase/migrations/**'
  workflow_dispatch:
concurrency:
  group: uat-308-local-replay
  cancel-in-progress: true
jobs:
  local-only-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_REF: ''
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Show environment
        run: |
          supabase --version
          docker --version
      - name: Check historical migration placeholder
        run: |
          if node scripts/uat-audit/migration-content-provenance.mjs; then
            echo "Historical SQL provenance matches local checks"
          else
            echo "::warning::Historical migration placeholder is incomplete. Local replay is diagnostic, not a production deployment."
          fi
      - name: Record exact historical migration file bytes
        run: |
          ls -l supabase/migrations/20260721093501_remote_schema.sql
          ls -l britium-go-live/supabase/migrations/20260721093501_remote_schema.sql
          wc -c supabase/migrations/20260721093501_remote_schema.sql
          sha256sum supabase/migrations/20260721093501_remote_schema.sql
          grep -n -m 3 'create type.*delivery_status' supabase/migrations/20260721093501_remote_schema.sql || true
      - name: Use July snapshot as disposable CI baseline
        env:
          UAT_308_DISPOSABLE_ONLY: '1'
        run: node scripts/uat-audit/ci-snapshot-first-replay.mjs
      - name: Configure isolated CI Postgres ports
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'supabase/config.toml';
          let config = readFileSync(file, 'utf8');
          const runId = Number(process.env.GITHUB_RUN_ID);
          if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('GITHUB_RUN_ID missing');
          const databasePort = 40000 + runId % 7000;
          const shadowPort = databasePort + 8000;
          const poolerPort = databasePort + 16000;
          const changes = [
            [/^project_id = "branch_office_nav_fixes"$/m, 'project_id = "uat308_ci_replay"'],
            [/^port = 54326$/m, 'port = ' + databasePort],
            [/^shadow_port = 54320$/m, 'shadow_port = ' + shadowPort],
            [/^port = 54329$/m, 'port = ' + poolerPort]
          ];
          for (const [pattern, replacement] of changes) {
            if (!pattern.test(config)) throw new Error('Expected CI config baseline missing: ' + pattern);
            config = config.replace(pattern, replacement);
          }
          writeFileSync(file, config);
          NODE
      - name: Start disposable local Supabase database
        run: supabase start --debug
      - name: Replay all repository migrations locally
        run: supabase db reset --debug
      - name: Install authentic operational RPCs into disposable database
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db --format '{{.ID}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "::error::Disposable Supabase PostgreSQL container not found"
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < scripts/uat-audit/uat_restore_authentic_8_rpcs_after_schema.sql
      - name: Assert required app RPCs and operational schema in disposable database
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db --format '{{.ID}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "::error::Disposable Supabase PostgreSQL container not found"
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < scripts/uat-audit/uat_operational_rpc_assert.sql
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true
