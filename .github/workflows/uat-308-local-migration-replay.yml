name: UAT 308 Local Migration Replay (No Remote DB)
on:
  workflow_dispatch:
concurrency:
  group: uat-308-local-replay
  cancel-in-progress: true
jobs:
  local-only-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_REF: ''
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show environment
        run: |
          supabase --version
          docker --version
      - name: Check historical migration placeholder
        run: |
          if node scripts/uat-audit/migration-content-provenance.mjs; then
            echo "Historical SQL provenance matches local checks"
          else
            echo "::warning::Historical migration placeholder is incomplete. Local replay is diagnostic, not a production deployment."
          fi
      - name: Record exact historical migration file bytes
        run: |
          ls -l supabase/migrations/20260721093501_remote_schema.sql
          ls -l britium-go-live/supabase/migrations/20260721093501_remote_schema.sql
          wc -c supabase/migrations/20260721093501_remote_schema.sql
          sha256sum supabase/migrations/20260721093501_remote_schema.sql
          grep -n -m 3 'create type.*delivery_status' supabase/migrations/20260721093501_remote_schema.sql || true
      - name: Use July snapshot as disposable CI baseline
        env:
          UAT_308_DISPOSABLE_ONLY: '1'
        run: node scripts/uat-audit/ci-snapshot-first-replay.mjs
      - name: Start disposable local Supabase database
        run: supabase start --debug
      - name: Replay all repository migrations locally
        run: supabase db reset --debug
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true
