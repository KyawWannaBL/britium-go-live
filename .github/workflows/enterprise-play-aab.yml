name: Enterprise Play AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enterprise-play-aab.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build web and synchronize Android
        working-directory: britium-go-live
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Build signed Enterprise App Bundle
        working-directory: britium-go-live
        env:
          KEYSTORE_BASE64: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENTERPRISE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENTERPRISE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/enterprise-release.jks
          chmod 600 android/app/enterprise-release.jks
          keytool -list -keystore android/app/enterprise-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          cat >> android/app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              enterprisePlay {
                storeFile file("enterprise-release.jks")
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.enterprisePlay
              }
            }
          }
          GRADLE
          cd android
          ./gradlew --no-daemon bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../Britium-Express-Enterprise.aab
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Britium-Express-Enterprise-AAB
          path: britium-go-live/Britium-Express-Enterprise.aab
          retention-days: 30
