name: Finance Workspace UX Regression
on:
  pull_request:
    paths:
      - 'britium-go-live/src/pages/FinancePortalPage.tsx'
      - 'britium-go-live/src/pages/EnterpriseLiveCenterPages.tsx'
      - 'britium-go-live/src/components/finance/DailyCashierSettlementPanel.tsx'
      - 'britium-go-live/src/components/finance/FinanceSettlementDayEvents.tsx'
      - 'britium-go-live/scripts/test-finance-workspace-tabs-ui.mjs'
      - '.github/workflows/finance-workspace-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-tabs-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node britium-go-live/scripts/test-finance-workspace-tabs-ui.mjs
