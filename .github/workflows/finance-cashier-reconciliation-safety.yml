name: Finance Daily Cashier Reconciliation Safety
on:
  pull_request:
    paths:
      - 'sql/finance_daily_cashier_reconciliation_v1_20261123.sql'
      - 'britium-go-live/src/components/finance/DailyCashierSettlementPanel.tsx'
      - 'britium-go-live/src/pages/FinancePortalPage.tsx'
      - 'britium-go-live/src/pages/RiderSettlementPage.tsx'
      - 'britium-go-live/src/pages/RiderFieldPortalApp.tsx'
      - 'britium-go-live/scripts/test-finance-daily-cashier-reconciliation.mjs'
      - '.github/workflows/finance-cashier-reconciliation-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cashier-reconciliation-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify finance vs cashier separation, source joins, field scope and export actions
        run: node britium-go-live/scripts/test-finance-daily-cashier-reconciliation.mjs
