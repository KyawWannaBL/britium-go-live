name: V137 Branch Verification

on:
  push:
    branches:
      - fix/data-entry-waybill-grid-map-v137

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 521020273d2449ce010679a2def91c244d06d966
      - name: Confirm V137 regression test failed before implementation
        working-directory: britium-go-live
        shell: bash
        run: |
          set +e
          node scripts/verify-data-entry-waybill-grid-map-v137.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected pre-fix V137 contract to fail, but it passed."
            exit 1
          fi
          echo "Pre-fix V137 contract failed as expected."

  green-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: britium-go-live/package-lock.json
      - name: Install
        working-directory: britium-go-live
        run: npm ci
      - name: V137 contract
        working-directory: britium-go-live
        run: npm run verify:data-entry-waybill-grid-map-v137
      - name: Production build
        working-directory: britium-go-live
        run: npm run build
