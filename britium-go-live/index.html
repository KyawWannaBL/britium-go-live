<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      name="description"
      content="Britium Express enterprise dispatch and rider operations portal"
    />
    <title>Britium Express</title>
    
    <!-- Google Fonts implementation for Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Legacy direct URLs: Vercel serves the SPA, then normalize to HashRouter paths. -->
    <script>
      (function () {
        var supported = ["/parcel-control", "/parcel-follow-up", "/admin-hr"];
        var path = window.location.pathname.replace(/\\/$/, "") || "/";
        if (supported.indexOf(path) !== -1 && !window.location.hash) {
          window.history.replaceState(null, "", "/" + window.location.search + "#" + path);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
