<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Britium Account Recovery</title></head><body><script>(function(){try{var q=new URLSearchParams(location.search);var h=new URLSearchParams(location.hash.replace(/^#/,""));var mode=q.get("mode")==="rider"?"rider":"portal";var next=q.get("next")||(mode==="rider"?"/rider-dashboard":"/dashboard");var access=h.get("access_token");var refresh=h.get("refresh_token");if(!access||!refresh){location.replace("/#/forgot-password?mode="+encodeURIComponent(mode)+"&error=recovery_link");return;}sessionStorage.setItem("britium-recovery-session",JSON.stringify({access_token:access,refresh_token:refresh}));location.replace("/#/must-change-password?mode="+encodeURIComponent(mode)+"&next="+encodeURIComponent(next));}catch(e){location.replace("/#/forgot-password?error=recovery_link");}})();</script></body></html>
