<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>Reset Password | Britium Express</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061524;color:#eef8ff;font:15px/1.55 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(460px,100%);padding:30px;border:1px solid #1a3a5c;border-radius:20px;background:#0b2236}h1{font-size:24px;margin:0 0 14px}p{color:#b7d2e6}label{display:block;font-weight:650;margin-top:18px}input{width:100%;padding:14px;border:1px solid #56708a;border-radius:9px;background:white;color:#091b2e;margin-top:7px;font-size:16px}button{margin-top:22px;padding:14px;width:100%;background:#f6b84b;color:#061524;border:0;border-radius:9px;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#f6b84b}#form{display:none}#message{white-space:pre-wrap}
</style></head>
<body><main>
<h1>Britium Express - Password Reset</h1>
<p id="message" role="status" aria-live="polite">Checking your secure recovery link...</p>
<form id="form">
<label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="submit" type="submit">Update password</button>
</form>
<p><a href="/#/forgot-password">Request another reset link</a></p>
<p><a href="/#/login">Return to login</a></p></main>
<script>
(function(){
"use strict";
var PUBLIC_SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdGF2YWJ2andvY2tua3l2d2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMTMxOTQsImV4cCI6MjA4NjY4OTE5NH0.7-9BK6L9dpCYIB-pp1WOeQxCI1DVxnSykoTRXNUHYIo";
var message=document.getElementById("message"),form=document.getElementById("form"),submit=document.getElementById("submit");
var query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,""));
var access=hash.get("access_token"),refresh=hash.get("refresh_token"),type=hash.get("type")||query.get("type");
var failure=hash.get("error")||query.get("error");
history.replaceState(history.state,"",location.pathname);
if(failure){message.textContent="This recovery link could not be verified. Please request a new link.";return;}
if(!access||!refresh||type!=="recovery"){message.textContent="The recovery link is incomplete or expired. Request a fresh email and open its newest link.";return;}
form.style.display="block";
message.textContent="Recovery link accepted. Enter and confirm a new password.";
form.addEventListener("submit",async function(event){
event.preventDefault();
var password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
if(password.length<8){message.textContent="Password must contain at least 8 characters.";return;}
if(password!==confirm){message.textContent="Passwords do not match.";return;}
submit.disabled=true;message.textContent="Updating password...";
try{
var response=await fetch("/supabase/auth/v1/user",{
method:"PUT",
headers:{"apikey":PUBLIC_SUPABASE_KEY,"Authorization":"Bearer "+access,"Content-Type":"application/json"},
body:JSON.stringify({password:password}),cache:"no-store",credentials:"omit"
});
if(!response.ok){
var error=await response.json().catch(function(){return {};});
throw new Error(response.status===401||response.status===403?"Recovery session expired. Request a new link.":String(error.msg||error.message||"Password update failed."));
}
access=null;refresh=null;form.remove();
message.textContent="Password updated successfully. Return to login and enter your new password.";
}catch(error){message.textContent=error instanceof TypeError?"Unable to reach the recovery service. Check your connection and retry.":(error.message||"Password update failed.");submit.disabled=false;}
});
})();
</script></body></html>
